name: Check

on:
  pull_request:
  push:
    branches: [main]

# Read-only: this workflow never pushes, comments, or deploys.
permissions:
  contents: read

jobs:
  # Named `eval` so it can be made a required status check later
  # (Settings -> Branches -> require "Check / eval").
  eval:
    name: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v14

      # Eval is dominated by fetching and evaluating nixpkgs, not by building,
      # so the cache earns its keep here even though nothing is built: it
      # persists the evaluated store paths between runs.
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # Two steps, deliberately.
      #
      # The first is byte-for-byte what a local session runs (`check` in the
      # devShell, or ./scripts/check.sh), so "it passed locally" and "it passed
      # in CI" mean the same thing — and it prints one readable line per
      # machine, evaluating all five before failing so one break cannot hide
      # four.
      #
      # The second builds `checks.mneme` — 37 tests that run at build time and
      # otherwise only run if someone happens to build ernst.
      #
      # NOT `nix flake check`, and this was MEASURED rather than assumed: it
      # took this job from 7m12s to 30m37s, because it re-evaluates all five
      # nixosConfigurations on top of the step above and then evaluates every
      # other flake output as well. Building the one check that adds coverage
      # gets the tests for a few seconds. `nix flake check` still works and is
      # the right thing to run locally when changing flake outputs.
      #
      # Still no `nix build` of a machine toplevel: five of them would pull KDE,
      # Steam and Plasma closures on every PR. Real builds stay a pre-merge step
      # on a warm store — see docs/guides/accepting-pull-requests.md.
      #
      # --no-update-lock-file so a PR cannot silently pass against a lock it did
      # not commit.
      - name: Evaluate all machine toplevels
        run: bash scripts/check.sh

      - name: Run the mneme test suite
        run: nix build --no-update-lock-file -L --no-link '.#checks.x86_64-linux.mneme'
