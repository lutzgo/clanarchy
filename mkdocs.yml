site_name: Clanarchy
site_description: NixOS declarative configuration — guides and option reference
site_url: https://lutzgo.github.io/clanarchy
repo_url: https://github.com/lutzgo/clanarchy
repo_name: lutzgo/clanarchy
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
    - First-time install: guides/first-time-install.md
    - Deploying and testing: guides/deploy.md
    - Updating machines: guides/updating-machines.md
    - Adding a machine: guides/adding-a-machine.md
    - Accepting pull requests: guides/accepting-pull-requests.md
    - Testing a PR: guides/testing-a-pr.md
    - Networking: guides/networking.md
    - YubiKey: guides/yubikey.md
    - YubiKey SSH setup: guides/yubikey-ssh-setup.md
    - Impermanence: guides/impermanence.md
    - Remote unlock: guides/remote-unlock.md
    - ernst zdata datasets: guides/ernst-zdata-datasets.md
    - Firmware updates: guides/firmware-updates.md
    - Noctalia profiles: guides/noctalia-profiles.md
    - OBS / Sony webcam: guides/obs-sony-webcam.md
  - Runbooks:
    - ZFS auto-snapshot opt-in: runbooks/zfs-auto-snapshot-optin.md
    - ernst zroot drive replacement: runbooks/ernst-zroot-drive-replacement.md
  - Incidents:
    - ernst slot-12 drive drop (2026-08-11): incidents/ernst-slot12-drop-2026-08-11.md
  - Reference:
    - Overview: reference/index.md
    - Hardware: reference/hardware.md
    - Roles: reference/roles.md
    - Desktop: reference/desktop.md
    - Apps: reference/apps.md
    - Users: reference/users.md
    - WiFi: reference/wifi.md
